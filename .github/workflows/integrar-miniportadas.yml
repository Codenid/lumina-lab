name: Integrar miniportadas Lumina Retail

on:
  push:
    paths:
      - '.github/workflows/integrar-miniportadas.yml'
      - 'docs/informe-tecnico/assets/miniportadas/lumina_integracion_miniportadas_v2.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descomprimir miniportadas y actualizar informe
        shell: bash
        run: |
          set -euo pipefail
          ASSETS="docs/informe-tecnico/assets/miniportadas"
          ZIP="$ASSETS/lumina_integracion_miniportadas_v2.zip"
          if [ ! -f "$ZIP" ]; then ZIP="$ASSETS/lumina_integracion_miniportadas.zip"; fi
          REPORT="docs/informe-tecnico/informe/informe-tecnico-implementacion-gcp.md"
          test -f "$ZIP"
          test -f "$REPORT"
          mkdir -p /tmp/lumina-miniportadas
          unzip -q "$ZIP" -d /tmp/lumina-miniportadas
          for i in $(seq -w 1 12); do
            files=(/tmp/lumina-miniportadas/lumina_miniportadas/"$i"-*.png)
            test "${#files[@]}" -eq 1
            cp "${files[0]}" "$ASSETS/"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("docs/informe-tecnico/informe/informe-tecnico-implementacion-gcp.md")
          content = p.read_text(encoding="utf-8")
          updated, n = re.subn(r"(\.\./assets/miniportadas/\d{2}-[a-z0-9-]+)\.svg", r"\1.png", content)
          assert n in (0, 12), f"Referencias SVG inesperadas: {n}"
          assert len(re.findall(r"\.\./assets/miniportadas/\d{2}-[a-z0-9-]+\.png", updated)) == 12, "Se esperaban 12 referencias PNG"
          p.write_text(updated, encoding="utf-8")
          PY
          test "$(find "$ASSETS" -maxdepth 1 -name '*.png' | wc -l)" -ge 12
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ASSETS"/*.png "$REPORT"
          if ! git diff --cached --quiet; then
            git commit -m "docs: integrar 12 miniportadas PNG en informe Lumina Retail"
            git push
          fi
